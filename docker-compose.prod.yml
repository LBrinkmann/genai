services:
  backend:
    build:
      target: prod
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HF_INFERENCE_TOKEN=${HF_INFERENCE_TOKEN}
    volumes:
      - ./config:/app/config:ro
    command: >
      gunicorn app.main:app
      --worker-class uvicorn.workers.UvicornWorker
      --workers 2
      --bind 0.0.0.0:8000
      --timeout 600
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  frontend:
    build:
      target: build
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL}
    volumes:
      - frontend-static:/app/build
    command: ["echo", "Frontend build complete"]
    restart: "no"

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-chat.example.com}
      - CADDY_API_DOMAIN=${CADDY_API_DOMAIN:-api.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend-static:/srv/frontend:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    networks:
      - genai-net

  db:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

volumes:
  frontend-static:
  caddy-data:
  caddy-config:
