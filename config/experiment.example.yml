defaults:
  config: "comparison-test"   # which feedback config to load when no ?config= param
  log: true                   # whether to persist messages when no ?log= param

bots:
  - name: "gpt-4"
    model: "gpt-4"
    api_url: "https://api.openai.com/v1/chat/completions"
    api_key: "${OPENAI_API_KEY}"
    system_message: "You are a helpful assistant."

  - name: "gpt-4-concise"
    model: "gpt-4"
    api_url: "https://api.openai.com/v1/chat/completions"
    api_key: "${OPENAI_API_KEY}"
    system_message: "You are a helpful assistant. Keep your answers brief and to the point."

  # Example of a bot backed by a managed HuggingFace Inference
  # Endpoint. The optional ``llm_endpoint`` block tells the app this
  # bot can be started/stopped on demand: the admin gear menu exposes
  # per-endpoint Start/Stop plus a global Auto/On/Off mode, and (in Auto
  # or On mode) the public chat shows a "Wake the AI" button instead of
  # the composer while the endpoint is asleep.
  #
  # IMPORTANT: enable **scale-to-zero** on the HF endpoint itself (HF
  # dashboard → endpoint → Autoscaling). That native idle-shutoff is
  # what bounds cost — the app intentionally runs no shutoff timer of
  # its own. Omit the whole block for bots without a control surface.
  - name: "hf-managed-example"
    model: "NoraAl/GENocideAI-01"
    api_url: "https://twt8ziu7jvtabi5l.us-east-1.aws.endpoints.huggingface.cloud/v1/chat/completions"
    api_key: "${HF_INFERENCE_TOKEN}"
    system_message: ""
    llm_endpoint:
      provider: "hf"
      namespace: "NoraAl"
      name: "genocideai-01-ywg"

feedback_configs:
  - name: "comparison-test"
    bots: ["gpt-4", "gpt-4-concise"]
    main_preference_feedback: "I prefer this response"
    additional_categories:
      - "More helpful"
      - "More accurate"
      - "Better tone"
    # Display cap: how many resolved messages stay visible in the
    # chat surface. Older resolved messages dissolve via the canvas
    # effect. Pending RLHF comparisons (awaiting user selection)
    # are exempt from this cap.
    visible_limit: 3
    # Bot context cap: how many of the most recent messages get
    # included in conversation history sent to the bot. null = no
    # truncation.
    context_limit: null

  - name: "single-bot-test"
    bots: ["gpt-4"]
    main_preference_feedback: ""
    additional_categories: []
    visible_limit: 3
    context_limit: null
