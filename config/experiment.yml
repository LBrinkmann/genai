defaults:
  config: "comparison"
  log: true

bots:
  - name: "genocideai-a"
    display_name: "GENocideAI"
    model: "NoraAl/GENocideAI-01"
    api_url: "https://twt8ziu7jvtabi5l.us-east-1.aws.endpoints.huggingface.cloud/v1/chat/completions"
    api_key: "${HF_INFERENCE_TOKEN}"
    system_message: ""
    # Managed HuggingFace Inference Endpoint. When present, the admin
    # UI exposes Start/Stop + Auto/On/Off controls, and the public chat
    # offers a "Wake the AI" button while it's asleep. Enable
    # scale-to-zero on the HF endpoint itself — that native idle-shutoff
    # bounds cost; the app runs no shutoff timer. Drop the block for
    # bots that don't back onto an HF managed endpoint.
    llm_endpoint:
      provider: "hf"
      namespace: "NoraAl"
      name: "genocideai-01-ywg"

  - name: "genocideai-b"
    display_name: "GENocideAI"
    model: "NoraAl/GENocideAI-01"
    api_url: "https://twt8ziu7jvtabi5l.us-east-1.aws.endpoints.huggingface.cloud/v1/chat/completions"
    api_key: "${HF_INFERENCE_TOKEN}"
    system_message: ""

feedback_configs:
  - name: "default"
    bots: ["genocideai-a"]
    main_preference_feedback: ""
    additional_categories: []
    # Display cap: how many resolved messages stay visible in the
    # chat surface. Older resolved messages dissolve via the canvas
    # effect. Pending RLHF comparisons (awaiting user selection)
    # are exempt from this cap.
    visible_limit: 3
    # Bot context cap: how many of the most recent messages get
    # included in conversation history sent to the bot. null = no
    # truncation.
    context_limit: null

  - name: "comparison"
    bots: ["genocideai-a", "genocideai-b"]
    main_preference_feedback: "I prefer this response"
    additional_categories:
      - "Stronger identification"
      - "More accurate"
      - "Better tone"
    visible_limit: 3
    context_limit: null
