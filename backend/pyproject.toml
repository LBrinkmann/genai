[tool.poetry]
name = "genai-backend"
version = "0.1.0"
description = "GenAI RLHF Data Collection Platform — Backend API"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.34"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.30"
pydantic = "^2.0"
pyyaml = "^6.0"
httpx = "^0.28"
python-socketio = "^5.12"
gunicorn = "^23.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.25"
aiosqlite = "^0.21"
black = "^25.1"
isort = "^6.0"
flake8 = "^7.0"
pre-commit = "^4.0"

[tool.black]
line-length = 79

[tool.isort]
profile = "black"
line_length = 79

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
