services:
  backend:
    build:
      target: dev
    volumes:
      - ./backend:/app
      - ./config:/app/config
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HF_INFERENCE_TOKEN=${HF_INFERENCE_TOKEN}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  frontend:
    build:
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}

  db:
    ports:
      - "5432:5432"
